[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walrus-verity"
version = "0.1.6"
description = "Proof-chain registry for AI agents — backed by Walrus for persistent, portable, verifiable memory"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "vantage-ola" }]
requires-python = ">=3.11"
keywords = [
    "walrus",
    "sui",
    "blockchain",
    "agent-memory",
    "proof-chain",
    "registry",
    "ai",
    "llm",
    "memwal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/vantage-ola/verity"
Repository = "https://github.com/vantage-ola/verity"
Issues = "https://github.com/vantage-ola/verity/issues"
Changelog = "https://github.com/vantage-ola/verity/blob/main/CHANGELOG.md"

[project.scripts]
verity = "verity.cli.main:app"
verity-mcp = "verity.mcp_server:main"

[project.optional-dependencies]
memwal = ["memwal>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "memwal>=0.1.0",
    "mcp>=1.0",
]
mcp = [
    "mcp>=1.27.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]
artifacts = ["src/verity/skills/*.md"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/verity"]
branch = true
omit = ["src/verity/cli/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"
