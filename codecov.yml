coverage:
  status:
    project:
      default:
        target: 85%      # project coverage must stay above 85%
        threshold: 2%    # allow up to 2% drop before failing
    patch:
      default:
        target: 85%      # 85% of new/changed lines must be covered
        threshold: 5%    # allow down to 80% on small diffs

comment:
  layout: "reach,diff,flags,files"
  behavior: default
